<style>
    :root {
        --primaryTheme: #E60073;
        --primaryLightTheme: #ff379b;
        --secondaryTheme: #14c3ef;
        --secondaryLightTheme: #3fd4f9;
        --secondaryDarkTheme: #00031d;
        --darkBG: #00031d;
        --lightBG: white;
        --lightText: white;
        --darkText: #020731;
        --greyedOutText: #a5a5a5;
        --headerColor: #181818;
        --bodyTextColor: #4e4b66;
        --bodyTextColorWhite: #fafbfc;
        --whatsappGreen: #25D366;
        --fontMain: "Poppins", sans-serif;
        --fontHeading: "Poppins", sans-serif;
        --glowPrimary: 0 0 0.5rem 0.1rem var(--primaryTheme);
        --glowSecondary: 0 0 0.5rem 0.1rem var(--secondaryTheme);
    }

    @font-face {
    font-display: swap;
    font-family: 'Poppins';
    font-style: normal;
    font-weight: 100;
    src: url('/fonts/poppins-v24-latin-100.woff2') format('woff2');
    }

    @font-face {
    font-display: swap;
    font-family: 'Poppins';
    font-style: normal;
    font-weight: 400;
    src: url('/fonts/poppins-v24-latin-regular.woff2') format('woff2');
    }

    @font-face {
    font-display: swap;
    font-family: 'Poppins';
    font-style: normal;
    font-weight: 700;
    src: url('/fonts/poppins-v24-latin-700.woff2') format('woff2');
    }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--darkBG);
    }

    *, *:before, *:after {
        box-sizing: border-box;
    }

    button {
        border: none;
        margin: none;
    }

    svg {
        vertical-align: middle;
    }

    ul {
        list-style: none;
    }

    .bg-light {
        background-color: var(--lightBG);
    }

    .bg-dark {
        background-color: var(--darkBG);
    }

    .read-more-link {
        text-decoration: underline;
    }

    .inactive {
        opacity: 0;
        max-height: 0;
        visibility: hidden;
        position: absolute;
        transition: all 0.3s ease;
    }

    .active {
        opacity: 1;
        max-height: 1000px;
        transition: all 0.3s ease;
    }

    .icon-container {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 5em;
        height: 5em;
        border-radius: 50%;
        background-color: var(--primaryTheme);
    }

    html {
        font-family: var(--fontMain);
        color: var(--lightText);
    }

    h1 {
        text-transform: uppercase;
    }

    h1, h2, h3, h4, h5, h6 {
        font-weight: 700;
    }

    a {
        color: var(--lightText);
        text-decoration: none;
    }

    .text-primary-highlight {
        color: var(--primaryTheme) !important;
    }

    .text-secondary-highlight {
        color: var(--secondaryTheme);
    }

    .text-light {
        color: var(--lightText);
    }

    .text-dark {
        color: var(--darkText);
    }

    .text-greyed-out {
        color: var(--greyedOutText);
    }

    .text-eyebrow {
        text-transform: uppercase;
        font-weight: bold;
        color: var(--secondaryTheme);
    }

    h1 {
        font-size: 2.5rem;
        line-height: 2.5rem;
    }

    h2 {
        font-size: 2rem;
        line-height: 2.5rem;
    }

    h3 {
        font-size: 1.5rem;
        line-height: 1.75rem;
    }

    h4 {
        font-size: 1.25rem;
        line-height: 1.25rem;
    }

    .btn-primary {
        color: var(--lightText);
        background-color: var(--primaryTheme);
        border-radius: 999px;
        padding: 1rem;
        font-weight: bold;
        transition: color 0.3s, box-shadow 0.3s;
        box-shadow: 0 0 0.5rem 0.1rem var(--primaryTheme);
        text-align: center;
        text-transform: uppercase;
        font-size: 0.825em;
        margin: 1rem;
    }

    .btn-primary-wide {
        color: var(--lightText);
        background-color: var(--primaryTheme);
        border-radius: 999px;
        padding: 1rem;
        font-weight: bold;
        transition: color 0.3s, box-shadow 0.3s;
        box-shadow: 0 0 0.5rem 0.1rem var(--primaryTheme);
        width: 80%;
        text-transform: uppercase;
        font-size: 0.825em;
        text-align: center;
        margin: 1rem;
    }

    .btn-whatsapp {
        color: white;
        background-color: var(--whatsappGreen);
        border-radius: 999px;
        padding: 1rem;
        font-weight: bold;
        transition: color 0.3s, box-shadow 0.3s;
        box-shadow: 0 0 0.5rem 0.1rem var(--whatsappGreen);
        text-align: center;
        text-transform: uppercase;
        font-size: 0.825em;
        margin: 1rem;
    }

    .btn-primary:hover, 
    .btn-primary-wide:hover, 
    .btn-whatsapp:hover {
        background-color: var(--secondaryTheme);
        box-shadow: 0 0 0.5rem 0.1rem var(--secondaryTheme);
    }

    .nav-header {
        background-color: var(--darkBG);
        position: fixed;
        width: 100%;
        z-index: 1000;
        height: 4rem;
    }

    .nav-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 100%;
        width: 100%;
        box-shadow: 0 0 20px black;
    }

    .nav-button-group {
        display: flex;
        align-items: center;
    }

    .nav-logo {
        height: auto;
        max-height: 2.5rem;
    }

    .nav-navigation {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .nav-ul {
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 0.825em;
        position: relative;
    }

    @media only screen and (max-width: 768.99px) {

        .text-eyebrow {
            font-size: 0.6rem;
        }

        p {
            font-size: 0.825rem;
        }

        li {
            font-size: 0.825rem;
        }

        .desktop-hide {
            display: none;
        }

        .nav-container {
            padding: 1rem 1.5rem 0.7rem 0.7rem;
        }

        .nav-button-group {
            flex-direction: row-reverse;
        }

        .nav-toggle {
            background-color: var(--primaryTheme);
            width: 2rem;
            height: 2rem;
            box-sizing: border-box;
            display: block;
            box-shadow: 0 0 0.5rem 0.1rem var(--primaryTheme);
        }

        .nav-toggle-burger {
            margin: 0;
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 3px;
            align-items: center;
            justify-content: center;
        }

        .nav-toggle-line {
            width: 1.2rem;
            height: 2px;
            border-radius: 2px;
            background-color: var(--darkBG);
        }

        .nav-ul {
            background-color: var(--darkBG);
            position: absolute;
            top: 3rem;
            left: 0;
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 5px;
            opacity: 0;
            transition: opacity 0.3s ease;
            padding: 1rem;
        }

        .nav-li {
            padding: 5px;
            width: 100%;
        }

        .nav-ul.toggle-active {
            opacity: 1;
        }

        .nav-ul-dropdown {
            align-items: center;
            margin-top: 0.6rem;
            padding: 0.3rem;
            gap: 0.3rem;
            width: 100%;
        }

        .nav-ul-dropdown-li {
            width: 100%;
            padding: 5px;
        }

        .nav-button {
            padding: 0.5rem !important;
        }
        
        .nav-button:nth-of-type(1) {
            margin: 0 1rem 0 0 !important;
        }

        .nav-button:nth-of-type(2) {
            margin: 0 1rem !important;
        }
    }
    
    @media only screen and (min-width: 769px) {
        .text-sm {
            font-size: 0.625rem;
        }

        .mobile-hide {
            display: none;
        }

        .nav-container {
            padding: 1rem;
        }

        .nav-button-group {
            flex-direction: row;
        }

        .nav-toggle {
            display: none;
        }

        .nav-ul {
            gap: 1em;
        }

        .nav-ul-dropdown {
            display: flex;
            flex-direction: column;
            gap: 1em;
            position: absolute;
            top: 2.5rem;
            left: 1.5rem;
            min-width: 250px;
            max-width: 500px;
            background-color: var(--primaryTheme);
            padding: 1em;
            border-radius: 1rem;
            box-shadow: var(--glowPrimary);
        }

        .nav-button {
            padding: 0.5rem 2rem !important;
        }

        .nav-button:nth-of-type(1) {
            margin: 0 0.5rem !important;
        }

        .nav-button:nth-of-type(2) {
            margin: 0 !important;
        }
    }
</style>
